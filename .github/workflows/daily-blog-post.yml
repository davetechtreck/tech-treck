name: Daily Tech Trek posts

on:
  schedule:
    # 3 runs/day, spread through the day in Toronto time (America/Toronto).
    # Cron always runs in UTC and does NOT auto-adjust for daylight saving,
    # so these UTC times are set for EDT (UTC-4, roughly mid-March to early
    # November). During EST (UTC-5, winter) each run will land ~1 hour
    # later Toronto-time than listed. Edit anytime: https://crontab.guru
    - cron: "0 12 * * *"   # ~8:00 AM Toronto (EDT)
    - cron: "0 18 * * *"   # ~2:00 PM Toronto (EDT)
    - cron: "0 0 * * *"    # ~8:00 PM Toronto (EDT) — this is 00:00 UTC, i.e. just after midnight UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_posts.py

      - name: Build site
        run: python build.py

      - name: Commit and push new posts
        run: |
          git config user.name "tech-trek-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ dist/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto: daily tech news posts $(date -u +'%Y-%m-%d')"
          git push

      # If any prior step failed, open a GitHub issue flagging it (or add a
      # comment to the existing one, so a bad day doesn't spam you with a
      # new issue every single run).
      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "autoposter-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `A scheduled run of **${context.workflow}** failed.\n\n` +
              `- Run: ${runUrl}\n` +
              `- Time (UTC): ${new Date().toISOString()}\n\n` +
              `Check the run log above for the actual error (common causes: ` +
              `\`ANTHROPIC_API_KEY\` invalid/expired, out of API credit, or ` +
              `the model returned output the parser couldn't handle).`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Tech Trek autoposter is failing",
                body,
                labels: [label],
              });
            }

      # If this run succeeded, close out any open failure issue — a clean
      # run means whatever was wrong is resolved.
      - name: Close failure issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "autoposter-failure";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "A subsequent run succeeded — closing this out.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
