name: Draft post from my notes

on:
  push:
    paths:
      - "notes/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic library
        run: pip install anthropic

      - name: Write the draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          AMAZON_DOMAIN: ${{ vars.AMAZON_DOMAIN }}
        run: python scripts/generate_posts.py

      - name: Save the draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts posts
          git diff --cached --quiet || (git commit -m "Draft from notes" && git push)
