name: Daily newsletter digest

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC, 9am EDT
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send digest
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python scripts/send_daily_digest.py
