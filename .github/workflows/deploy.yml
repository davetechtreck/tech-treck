name: Daily post, build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Two crons because GitHub schedules in UTC and Toronto changes offset
    # with daylight saving. The "check" job below lets only the matching one run.
    - cron: "30 12 * * *"  # 8:30am Toronto in summer time (EDT, UTC-4)
    - cron: "30 13 * * *"  # 8:30am Toronto in winter time (EST, UTC-5)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Only run the cron that matches Toronto's current UTC offset
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          OFFSET=$(TZ=America/Toronto date +%z)
          RUN=false
          if [ "$EVENT" != "schedule" ]; then
            RUN=true   # pushes and manual runs always go ahead
          elif [ "$OFFSET" = "-0400" ] && [ "$SCHEDULE" = "30 12 * * *" ]; then
            RUN=true
          elif [ "$OFFSET" = "-0500" ] && [ "$SCHEDULE" = "30 13 * * *" ]; then
            RUN=true
          fi
          echo "Toronto offset $OFFSET, event $EVENT, schedule '$SCHEDULE' -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs on the schedule and on manual runs, not when you push a change.
      # If it fails, the site still builds and deploys as normal.
      - name: Write today's post and tweets
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          AMAZON_DOMAIN: ${{ vars.AMAZON_DOMAIN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          pip install anthropic
          python scripts/generate_posts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p posts tweets
          git add posts tweets
          git diff --cached --quiet || (git commit -m "Auto: daily post and tweets" && git push)

      # The daily email digest now has its own workflow (Daily newsletter
      # digest), which runs at 9:30am Toronto time.

      - name: Build site
        run: python build.py
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
