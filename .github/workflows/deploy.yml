name: Daily post, build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 12 * * *"  # 8:30am Toronto in summer time (EDT)
    - cron: "30 13 * * *"  # 8:30am Toronto in winter time (EST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs on the schedule and on manual runs, not when you push a change.
      # If it fails, the site still builds and deploys as normal.
      - name: Write today's post and tweets
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          AMAZON_DOMAIN: ${{ vars.AMAZON_DOMAIN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          pip install anthropic
          python scripts/generate_posts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p posts tweets
          git add posts tweets
          git diff --cached --quiet || (git commit -m "Auto: daily post and tweets" && git push)

      # Creates today's email in Kit (it sends 15 minutes later). On manual
      # runs it only does a dry run: checks your Kit key, sends nothing.
      - name: Email today's digest through Kit
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/send_daily_digest.py

      - name: Build site
        run: python build.py
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
