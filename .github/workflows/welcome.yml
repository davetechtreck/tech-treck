name: Welcome new subscribers

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour, at :07 and :37 (UTC)
  workflow_dispatch:
    inputs:
      test_email:
        description: "Optional: send ONE test welcome email to this address (Kit is not touched)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: welcome
  cancel-in-progress: false

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Send welcome emails
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: python3 scripts/send_welcome_email.py
